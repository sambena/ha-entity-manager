name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Compile-check Python sources
        run: python -m py_compile analysis.py config.py deleted_store.py ha_client.py server.py

      - name: Check static assets exist
        run: |
          test -f static/index.html
          test -f static/app.js
          test -f static/style.css
